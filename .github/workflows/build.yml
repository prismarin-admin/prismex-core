name: build
on: [push]
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils python3 libdb++-dev libdb-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev libboost-test-dev libboost-thread-dev libminiupnpc-dev libzmq3-dev libfmt-dev
      - name: Build
        run: ./autogen.sh && ./configure --without-gui --with-incompatible-bdb && make -j2
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prismexd-linux
          path: |
            src/prismexd
            src/prismex-cli
            src/prismex-tx
            src/prismex-wallet
